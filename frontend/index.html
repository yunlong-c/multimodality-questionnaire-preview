<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>序列预测小工具｜时间序列预测研究</title>
  </head>
  <body>
    <!-- Frozen v1 blueprint: retained so historical submissions remain
         identifiable, but the participant app never writes new v1 rows. -->
    <form
      name="mmq-submission-v1"
      method="POST"
      data-netlify="true"
      hidden
    >
      <input type="hidden" name="form-name" value="mmq-submission-v1" />
      <input type="hidden" name="session_id" />
      <input type="hidden" name="participant_id" />
      <input type="hidden" name="format_assignment" />
      <input type="hidden" name="dataset_classification" />
      <input type="hidden" name="stimulus_set_version" />
      <input type="hidden" name="catalog_hash" />
      <input type="hidden" name="submitted_at" />
      <input type="hidden" name="payload_sha256" />
      <input type="hidden" name="allocation_id" />
      <input type="hidden" name="randomization_version" />
      <input type="hidden" name="allocation_method" />
      <input type="hidden" name="allocation_status" />
      <input type="hidden" name="assigned_at" />
      <input type="hidden" name="fallback_reason_code" />
      <input type="hidden" name="fallback_reconciled_at" />
      <input type="hidden" name="submit_attempt_count" />
      <input type="hidden" name="submit_latency_ms" />
      <input type="hidden" name="submit_latency_scope" />
      <textarea name="payload_json"></textarea>
    </form>
    <!-- V2 Forms are emergency/replica channels. A Forms 2xx response is not
         an authoritative receipt and never changes the participant page to
         "saved". Formal and test data stay in separate form collections. -->
    <form
      name="mmq-submission-v2-formal"
      method="POST"
      data-netlify="true"
      hidden
    >
      <input type="hidden" name="form-name" value="mmq-submission-v2-formal" />
      <input type="hidden" name="session_id" />
      <input type="hidden" name="participant_id" />
      <input type="hidden" name="client_token" />
      <input type="hidden" name="format_assignment" />
      <input type="hidden" name="dataset_classification" />
      <input type="hidden" name="stimulus_set_version" />
      <input type="hidden" name="catalog_hash" />
      <input type="hidden" name="submitted_at" />
      <input type="hidden" name="payload_sha256" />
      <input type="hidden" name="allocation_id" />
      <input type="hidden" name="randomization_version" />
      <input type="hidden" name="allocation_method" />
      <input type="hidden" name="allocation_status" />
      <input type="hidden" name="assigned_at" />
      <input type="hidden" name="fallback_reason_code" />
      <input type="hidden" name="fallback_reconciled_at" />
      <input type="hidden" name="submit_attempt_count" />
      <input type="hidden" name="submit_latency_ms" />
      <input type="hidden" name="submit_latency_scope" />
      <input type="hidden" name="receipt_id" />
      <input type="hidden" name="authoritative_stored_at" />
      <input type="hidden" name="submission_authority" />
      <input type="hidden" name="mirror_status" />
      <input type="hidden" name="mirror_source" />
      <textarea name="payload_json"></textarea>
    </form>
    <form
      name="mmq-submission-v2-test"
      method="POST"
      data-netlify="true"
      hidden
    >
      <input type="hidden" name="form-name" value="mmq-submission-v2-test" />
      <input type="hidden" name="session_id" />
      <input type="hidden" name="participant_id" />
      <input type="hidden" name="client_token" />
      <input type="hidden" name="format_assignment" />
      <input type="hidden" name="dataset_classification" />
      <input type="hidden" name="stimulus_set_version" />
      <input type="hidden" name="catalog_hash" />
      <input type="hidden" name="submitted_at" />
      <input type="hidden" name="payload_sha256" />
      <input type="hidden" name="allocation_id" />
      <input type="hidden" name="randomization_version" />
      <input type="hidden" name="allocation_method" />
      <input type="hidden" name="allocation_status" />
      <input type="hidden" name="assigned_at" />
      <input type="hidden" name="fallback_reason_code" />
      <input type="hidden" name="fallback_reconciled_at" />
      <input type="hidden" name="submit_attempt_count" />
      <input type="hidden" name="submit_latency_ms" />
      <input type="hidden" name="submit_latency_scope" />
      <input type="hidden" name="receipt_id" />
      <input type="hidden" name="authoritative_stored_at" />
      <input type="hidden" name="submission_authority" />
      <input type="hidden" name="mirror_status" />
      <input type="hidden" name="mirror_source" />
      <textarea name="payload_json"></textarea>
    </form>
    <div id="app"></div>
    <footer id="regulatory-footer" class="regulatory-footer" hidden></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
  </html>
